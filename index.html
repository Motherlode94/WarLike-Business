<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><meta name="description" content="WarLike Business - suite WarLike"><title>WarLike Business</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8ecf6;background:#090d18}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#101625;border-right:1px solid #263044;padding:24px 16px}.brand{font-weight:850;font-size:19px;letter-spacing:.5px;margin:0 0 30px}.brand span{color:#a78bfa}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;color:#aebbd2;text-align:left;padding:13px 14px;border-radius:11px}.nav button.active,.nav button:hover{background:#222c43;color:#fff}.main{min-width:0;padding:32px;max-width:1350px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.muted{color:#9aa9c0}.small{font-size:13px}h1{font-size:29px;margin:6px 0 12px}h2{font-size:20px}h3{font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:22px 0}.panel{background:#151d2d;border:1px solid #2a364d;border-radius:17px;padding:20px;min-width:0}.panel h3{margin:5px 0}.stat{font-size:30px;font-weight:750}.primary{background:#7958e8;color:white;border:0;border-radius:10px;padding:11px 17px}.secondary{background:#26324a;color:white;border:1px solid #40516d;border-radius:10px;padding:10px 15px}.danger{background:#4b2332;color:#ffb9bf;border:1px solid #7c334c;border-radius:10px;padding:9px 12px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stack{display:grid;gap:14px}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #43516b;background:#0e1422;color:#e8ecf6}.field textarea{min-height:85px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:560px}.table th,.table td{text-align:left;padding:13px 9px;border-bottom:1px solid #303c50}.table th{color:#9aa9c0;font-size:13px}.pill{font-size:12px;background:#2f3c56;padding:5px 9px;border-radius:99px;display:inline-block}.hidden{display:none!important}.bar{height:8px;background:#344258;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#9b82ff}.footer{font-size:12px;color:#91a0b7;margin-top:25px}.notice{border-left:3px solid #9b82ff;padding:12px;background:#222a3d;color:#dce3f0;border-radius:8px;margin:14px 0}@media(max-width:750px){.layout{display:block}.side{position:static;border-right:0;border-bottom:1px solid #263044;padding:16px}.brand{margin-bottom:12px}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap}.main{padding:20px 14px}h1{font-size:24px}}</style></head><body><div class="layout"><aside class="side"><div class="brand">WARLIKE <span>BUSINESS</span></div><nav class="nav" aria-label="Navigation principale"><button data-view="dashboard" class="active">📊 Vue générale</button><button data-view="clients">👥 Clients</button><button data-view="quotes">📄 Devis</button><button data-view="invoices">🧾 Factures</button></nav></aside><main class="main"><div class="top"><div><div class="muted small">WARLIKE / OPERATIONS</div><h1 id="title">Vue générale</h1></div><button class="secondary" id="reset">Réinitialiser la démo</button></div><div class="notice">MVP local sans backend : données conservées uniquement dans ce navigateur. Les documents et paiements sont simulés, sans valeur fiscale ni paiement bancaire.</div><section id="app" aria-live="polite"></section><div class="footer">WarLike Business · Démonstration de gestion · Aucune donnée transmise</div></main></div><script>
"use strict";
const KEY="warlike-business-demo-v1";const initial=()=>({clients:[{id:"c1",name:"WarLike Group",email:"contact@example.invalid"}],quotes:[],invoices:[],counter:1});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}let view="dashboard";const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(n)||0);const client=id=>data.clients.find(c=>c.id===id)?.name||"Client supprimé";const nextId=()=>String(++data.counter);const today=()=>new Date().toISOString().slice(0,10);const btn=(text,action,id,cls="secondary")=>'<button class="'+cls+'" data-action="'+action+'" data-id="'+id+'">'+text+'</button>';const customerOptions=()=>data.clients.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join("");
function render(){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.getElementById("title").textContent=({dashboard:"Vue générale",clients:"Gestion des clients",quotes:"Devis commerciaux",invoices:"Facturation"})[view];const app=document.getElementById("app");const pending=data.invoices.filter(i=>i.status!=="payée").reduce((a,i)=>a+Number(i.amount),0);const paid=data.invoices.filter(i=>i.status==="payée").reduce((a,i)=>a+Number(i.amount),0);if(view==="dashboard"){app.innerHTML='<div class="grid"><div class="panel"><div class="muted">Clients</div><div class="stat">'+data.clients.length+'</div></div><div class="panel"><div class="muted">Devis</div><div class="stat">'+data.quotes.length+'</div></div><div class="panel"><div class="muted">Factures encaissées</div><div class="stat">'+money(paid)+'</div></div><div class="panel"><div class="muted">Factures non payées</div><div class="stat">'+money(pending)+'</div></div></div><div class="panel"><h2>Cycle commercial</h2><p>1. Créer un client → 2. Émettre un devis → 3. Convertir en facture → 4. Enregistrer son règlement.</p><p class="muted">Aucun paiement réel ou envoi d'email n'est effectué.</p></div>';}
if(view==="clients"){app.innerHTML='<div class="panel"><h2>Nouveau client</h2><form id="client-form"><label class="field">Nom / organisation<input name="name" maxlength="120" required></label><label class="field">Email<input type="email" name="email" required maxlength="200"></label><button class="primary">Ajouter un client</button></form></div><div class="panel" style="margin-top:18px"><h2>Répertoire</h2><div class="tablewrap"><table class="table"><thead><tr><th>Nom</th><th>Email</th><th>Actions</th></tr></thead><tbody>'+data.clients.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'</td><td>'+btn("Supprimer","delete-client",c.id,"danger")+'</td></tr>').join("")+'</tbody></table></div></div>';document.getElementById("client-form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.clients.push({id:"c"+nextId(),name:String(f.get("name")).trim(),email:String(f.get("email")).trim()});save();render()};}
if(view==="quotes"){app.innerHTML='<div class="panel"><h2>Nouveau devis</h2><form id="quote-form"><label class="field">Client<select name="client" required>'+customerOptions()+'</select></label><label class="field">Prestation<input name="description" maxlength="220" required placeholder="Ex. Création de site web"></label><label class="field">Montant HT en EUR<input name="amount" type="number" min="0.01" step="0.01" max="100000000" required></label><button class="primary" '+(data.clients.length?"":"disabled")+'>Créer un devis</button></form></div><div class="panel" style="margin-top:18px"><h2>Devis enregistrés</h2><div class="tablewrap"><table class="table"><thead><tr><th>Référence</th><th>Client</th><th>Prestation</th><th>HT</th><th>Actions</th></tr></thead><tbody>'+data.quotes.map(q=>'<tr><td>'+esc(q.ref)+'</td><td>'+esc(client(q.client))+'</td><td>'+esc(q.description)+'</td><td>'+money(q.amount)+'</td><td class="flex">'+(q.invoiceId?'<span class="pill">Facturé</span>':btn("Convertir en facture","convert",q.id,"primary"))+btn("Imprimer","print-quote",q.id)+'</td></tr>').join("")+'</tbody></table></div></div>';document.getElementById("quote-form").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get("amount"));if(!Number.isFinite(amount)||amount<=0)return;const id=nextId();data.quotes.push({id,ref:"DEV-"+String(id).padStart(5,"0"),client:String(f.get("client")),description:String(f.get("description")).trim(),amount,date:today()});save();render()};}
if(view==="invoices"){app.innerHTML='<div class="panel"><h2>Factures générées depuis les devis</h2><p class="muted">Montants HT et TVA non calculée. Compléter les mentions légales, la TVA, le numéro fiscal et les coordonnées avant tout usage commercial.</p><div class="tablewrap"><table class="table"><thead><tr><th>Facture</th><th>Client</th><th>Prestation</th><th>Montant HT</th><th>État</th><th>Actions</th></tr></thead><tbody>'+data.invoices.map(i=>'<tr><td>'+esc(i.ref)+'</td><td>'+esc(client(i.client))+'</td><td>'+esc(i.description)+'</td><td>'+money(i.amount)+'</td><td><span class="pill">'+esc(i.status)+'</span></td><td class="flex">'+(i.status==="payée"?"":btn("Marquer payée","pay",i.id,"primary"))+btn("Imprimer","print-invoice",i.id)+'</td></tr>').join("")+'</tbody></table></div></div>';}}
document.addEventListener("click",e=>{const n=e.target.closest("[data-view]");if(n){view=n.dataset.view;render();return}const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.id,action=b.dataset.action;if(action==="delete-client"){if(data.quotes.some(q=>q.client===id)||data.invoices.some(i=>i.client===id)){alert("Client utilisé dans un document : suppression bloquée.");return}if(confirm("Supprimer ce client ?"))data.clients=data.clients.filter(c=>c.id!==id)}if(action==="convert"){const q=data.quotes.find(x=>x.id===id);if(!q||q.invoiceId)return;const i=nextId();q.invoiceId=i;data.invoices.push({id:i,ref:"FAC-"+String(i).padStart(5,"0"),client:q.client,description:q.description,amount:q.amount,status:"émise",date:today(),quoteRef:q.ref})}if(action==="pay"){const i=data.invoices.find(x=>x.id===id);if(i&&confirm("Confirmer que le paiement a été reçu hors de l'application ?"))i.status="payée"}if(action.startsWith("print-")){const item=(action==="print-quote"?data.quotes:data.invoices).find(x=>x.id===id);if(item)printDoc(item,action==="print-quote"?"DEVIS":"FACTURE");return}save();render()});
function printDoc(d,type){const w=window.open("","_blank");if(!w){alert("Autorise les fenêtres surgissantes pour imprimer.");return}const content='<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>'+type+' '+esc(d.ref)+'</title><style>body{font:16px Arial,sans-serif;max-width:800px;margin:55px auto;padding:20px;color:#111}h1{border-bottom:2px solid #333;padding-bottom:20px}p{line-height:1.7}small{color:#555}</style></head><body><h1>'+type+' — '+esc(d.ref)+'</h1><p>Émis le : '+esc(d.date)+'<br>Client : '+esc(client(d.client))+'<br>Prestation : '+esc(d.description)+'</p><h2>Montant HT : '+money(d.amount)+'</h2><p><small>DOCUMENT DE DÉMONSTRATION — NON VALABLE COMME FACTURE FISCALE. Mentions légales, émetteur, TVA et modalités à compléter.</small></p></body></html>';w.document.open();w.document.write(content);w.document.close();w.focus();w.print();}
document.getElementById("reset").onclick=()=>{if(confirm("Effacer toutes les données locales de démonstration ?")){data=initial();save();render()}};render();
</script></body></html>
